name: Moka Beta 6.1 persistent-key signed APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moka-beta061-manual-sign
  cancel-in-progress: false

jobs:
  sign-and-verify:
    # Never sign in a pull request or on unreviewed feature branches.
    if: github.repository == 'yooshastan/MokaMusicPlayer' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate local signing setup helper syntax
        run: bash -n scripts/configure-moka-github-signing.sh
      - name: Restore persistent release signing identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MOKA_SIGNING_STORE_B64 }}
          STORE_PASS: ${{ secrets.MOKA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOKA_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOKA_SIGNING_KEY_PASSWORD }}
          PINNED_CERT: ${{ secrets.MOKA_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          set +x
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=(MOKA_SIGNING_STORE_B64)
          [[ -n "$STORE_PASS" ]] || missing+=(MOKA_SIGNING_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(MOKA_SIGNING_KEY_ALIAS)
          [[ -n "$KEY_PASS" ]] || missing+=(MOKA_SIGNING_KEY_PASSWORD)
          [[ -n "$PINNED_CERT" ]] || missing+=(MOKA_SIGNING_CERT_SHA256)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub REPOSITORY secrets for yooshastan/MokaMusicPlayer: %s\n' "${missing[*]}"
            echo 'Store them under Settings > Secrets and variables > Actions > Repository secrets, not Variables or another repository/environment.' >&2
            echo 'Use bash scripts/configure-moka-github-signing.sh from your trusted Fedora workstation.' >&2
            exit 1
          fi
          if [[ ! "$PINNED_CERT" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::MOKA_SIGNING_CERT_SHA256 must be exactly 64 hexadecimal characters." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/moka-release.jks"
          test -s "$RUNNER_TEMP/moka-release.jks"
          # Check the actual key's public certificate before costly Android builds.
          # Never print keystore contents, the key alias, or passwords.
          if ! certificate_details="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/moka-release.jks" \
            -alias "$KEY_ALIAS" -storepass:env STORE_PASS 2>/dev/null)"; then
            echo "::error::Cannot inspect the configured signing alias; check Moka's keystore, alias and password repository secrets." >&2
            exit 1
          fi
          if [[ "$certificate_details" != *"Entry type: PrivateKeyEntry"* ]]; then
            echo "::error::Selected signing alias must be a PrivateKeyEntry." >&2
            exit 1
          fi
          actual_cert="$(printf '%s\n' "$certificate_details" | sed -n 's/.*SHA256: *//p' | head -n 1 | tr -d ':\r[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual_cert" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Unable to obtain SHA-256 from signing alias certificate." >&2
            exit 1
          fi
          echo "Public signing certificate SHA-256: $actual_cert"
          if [[ "$actual_cert" != "${PINNED_CERT,,}" ]]; then
            echo "::error::MOKA_SIGNING_CERT_SHA256 does not match the certificate actually contained in MOKA_SIGNING_STORE_B64. Compare with the already-published Moka APK before selecting an identity. No APK uploaded." >&2
            exit 1
          fi
          echo "Pinned release signing identity verified against keystore."
          echo "MOKA_SIGNING_STORE_FILE=$RUNNER_TEMP/moka-release.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0" \
            --channel=3 "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Verify Gradle release signing identity before compilation
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.MOKA_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          # Check the actual Gradle release VARIANT, not merely a key in the keystore.
          # Do not show the alias, passwords or keystore path in logs.
          signing_report="$(./gradlew :app:signingReport --console=plain --no-build-cache)"
          release_cert="$(printf '%s\n' "$signing_report" | awk '
            /^Variant: release$/ { in_release=1; next }
            /^Variant: / { in_release=0 }
            in_release && /^SHA-256:/ { print $2; exit }
          ' | tr -d ':\r[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$release_cert" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Gradle release variant has no readable signing certificate. Refusing to build a potentially unsigned or debug-signed APK."
            exit 1
          fi
          if [[ "$release_cert" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo "::error::Gradle release VARIANT certificate differs from the pinned keystore. Check app/build.gradle.kts signingConfig instead of changing GitHub secrets."
            echo "Gradle release certificate (public): $release_cert"
            exit 1
          fi
          echo "Gradle release signing certificate matches protected keystore."

      - name: Unit tests and signed release build
        shell: bash
        env:
          MOKA_SIGNING_STORE_PASSWORD: ${{ secrets.MOKA_SIGNING_STORE_PASSWORD }}
          MOKA_SIGNING_KEY_ALIAS: ${{ secrets.MOKA_SIGNING_KEY_ALIAS }}
          MOKA_SIGNING_KEY_PASSWORD: ${{ secrets.MOKA_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-build-cache --stacktrace
      - name: Verify APK version and pinned signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.MOKA_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$aapt" dump badging "$apk" | grep -E "package: name='com.mokamusic.player'.*versionCode='39'.*versionName='4.0.0-beta06.1-wonhee-preview'"
          # The certificate is public. Report the actual APK signer if it differs
          # from the proven private-keystore/Gradle certificate.
          report="$("$signer" verify --verbose --print-certs "$apk")"
          actual="$(printf '%s\n' "$report" | sed -nE 's/^[[:space:]]*Signer #[0-9]+ certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+)[[:space:]]*$/\1/p' | head -1 | tr -d ':\r[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::APK signature verifies, but its SHA-256 certificate line could not be parsed. Check apksigner format; do not alter the pinned key."
            # Limit the diagnostic to public signer certificate metadata, not passwords.
            printf '%s\n' "$report" | grep -E 'Signer #[0-9]+ certificate' || true
            exit 1
          fi
          if [[ "$report" == *"certificate DN: CN=Android Debug"* ]]; then
            echo "::error::Release APK has an Android Debug signing certificate. Refusing public distribution."
            exit 1
          fi
          if [[ "$actual" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo "::error::Built APK public certificate differs from Moka's verified private-keystore certificate."
            echo "APK actual public signer SHA-256: $actual"
            exit 1
          fi
          if "$aapt" dump badging "$apk" | grep -q '^application-debuggable'; then
            echo "::error::Release APK is debuggable. Refusing distribution."
            exit 1
          fi
          echo "APK signer, release variant and pinned keystore certificate all match."
          cp "$apk" Moka-Music-Player-4.0.0-beta06.1-wonhee-signed.apk
          sha256sum Moka-Music-Player-4.0.0-beta06.1-wonhee-signed.apk > SHA256SUMS.txt
          echo "Moka signed APK verified against pinned release certificate." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed preview (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: moka-beta061-persistent-key-signed-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            Moka-Music-Player-4.0.0-beta06.1-wonhee-signed.apk
            SHA256SUMS.txt
